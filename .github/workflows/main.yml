name: Build Eco Wallpaper
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out original open-source app
        uses: actions/checkout@v4
        with:
          repository: codeg0blin/video-live-wallpaper
          ref: v1.3.0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source changes
        run: |
          python3 apply_eco_patch.py upstream --check
          python3 apply_eco_patch.py upstream
          git -C upstream diff --check
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and test
        working-directory: upstream
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Eco-Wallpaper-debug
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
